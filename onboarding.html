  html,body{margin:0;background:#fff}
  body{font-family:"Creato Display",sans-serif;-webkit-font-smoothing:antialiased}
  svg text{font-family:"Creato Display",sans-serif;font-kerning:normal}
  /* 온보딩: 메인과 같은 자리(1920 격자)에서 시작 — 진행선이 DAY 1 → DAY 646 으로 지나가고, YBY가 섞이다 001D가 되며 메인으로 이어짐 */
  #intro{position:fixed;inset:0;z-index:100;background:#fff;transition:opacity .7s cubic-bezier(.4,0,.2,1)}
  #intro.out{opacity:0;pointer-events:none}
  #intro svg{position:absolute;left:0;top:0;width:100%;height:auto;overflow:visible}
  #intro text{fill:#0A0A0A}
  body.intro{overflow:hidden}
  #replay{position:fixed;right:24px;bottom:20px;font:12px "Creato Display",sans-serif;color:#0A0A0A;background:none;border:0;cursor:pointer;opacity:.6}
</style></head><body>
<div id="intro" aria-hidden="true"><svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <text x="365" y="259" font-size="48" letter-spacing="-.955" font-style="italic">Design In Progress...</text>
  <rect id="inTrack" x="365" y="623.5" width="1068" height="1" fill="#E4E4E4"/>
  <rect id="inBar" x="365" y="623.5" width="0" height="1" fill="#0A0A0A"/>
  <circle id="inDot" cx="365" cy="624" r="4" fill="#0A0A0A"/>
  <text id="inDay" x="365" y="661" font-size="18">DAY . 1</text>
  <text id="inDate" x="365" y="689" font-size="18">04.03.2025</text>
  <text id="inName" x="352 524.16 701.41 873.57" y="1011" font-size="300">YBY</text>
</svg></div>
<button id="replay" type="button">↻ REPLAY</button>
<script>
/* ───────── 온보딩 ───────── */
(function(){
  const box = document.getElementById('intro');
  
  document.body.classList.add('intro');
  const $i = id => document.getElementById(id);
  const name = $i('inName'), day = $i('inDay'), date = $i('inDate'), bar = $i('inBar'), dot = $i('inDot');
  const POOL = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  const rnd = () => POOL[(Math.random() * POOL.length) | 0];
  const X0 = 365, X1 = 1433, D0 = Date.UTC(2025, 2, 4), DUR = 2300, STEP = 60;
  const fmt = n => { const d = new Date(D0 + (n - 1) * 864e5); return [d.getUTCDate(), d.getUTCMonth() + 1].map(v => String(v).padStart(2, '0')).join('.') + '.' + d.getUTCFullYear(); };
  const finish = () => {   // YBY → 001 (메인 첫 숫자)로 섞이며 바뀐 뒤 메인으로
    const T = '001', t0 = performance.now(); let last = -1;
    const g = n => {
      const el = n - t0, step = Math.floor(el / STEP);
      if (step !== last){ last = step;
        const fixed = Math.floor(Math.min(1, el / 520) * 3);
        let out = ''; for (let i = 0; i < 3; i++) out += i < fixed ? T[i] : rnd();
        name.textContent = out;
        if (fixed >= 3){ setTimeout(() => { /* 백업: 마지막 장면에서 멈춤 (원래는 여기서 메인으로 넘어감) */ document.getElementById('replay').style.opacity = 1;  }, 380); return; }
      }
      requestAnimationFrame(g);
    };
    requestAnimationFrame(g);
  };
  const begin = () => {
    const t0 = performance.now(); let last = -1;
    const f = n => {
      const t = Math.min(1, (n - t0) / DUR), e = t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      const d = Math.max(1, Math.round(1 + 645 * e)), x = X0 + (X1 - X0) * e;
      bar.setAttribute('width', (x - X0).toFixed(1)); dot.setAttribute('cx', x.toFixed(1));
      day.setAttribute('x', x.toFixed(1)); date.setAttribute('x', x.toFixed(1));   // 라벨이 선 끝을 따라감 (646 = 메인의 DAY . 646 자리)
      day.textContent = 'DAY . ' + d; date.textContent = fmt(d);
      const step = Math.floor((n - t0) / STEP);
      if (step !== last){ last = step;
        const fixed = Math.floor(Math.max(0, (e - .5) / .45) * 3);
        let out = ''; for (let i = 0; i < 3; i++) out += i < fixed ? 'YBY'[i] : rnd();
        name.textContent = out;
      }
      if (t < 1) return requestAnimationFrame(f);
      name.textContent = 'YBY';
      setTimeout(finish, 450);
    };
    requestAnimationFrame(f);
  };
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(begin);
})();
</script>
<script>document.getElementById('replay').onclick=()=>location.reload();</script>
</body></html>
